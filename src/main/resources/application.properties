# ===========================================================================
# Cloud Vault — environment variable contract
#
# The deployment surfaces in this repository (docker-compose.yml,
# .env.example, docs/DEPLOYMENT.md, .github/workflows/ci.yml) configure the
# application with DB_URL / DB_USER / DB_PASSWORD / STORAGE_ROOT /
# ADMIN_USERNAME / ADMIN_PASSWORD / TRASH_RETENTION_DAYS / RATE_LIMIT_LOGIN /
# RATE_LIMIT_REGISTER. Spring Boot's canonical environment names
# (SPRING_DATASOURCE_URL, APP_STORAGE_ROOT, ...) are different, so without
# this mapping every one of those documented variables was silently ignored
# and a documented startup failed with "Failed to configure a DataSource:
# 'url' attribute is not specified". This file maps the documented names
# onto the properties the application actually reads.
#
# Precedence is unchanged: the system-environment property source outranks
# this file (SPRING_DATASOURCE_URL and APP_* still win when set), and the
# test suite overrides these keys through @DynamicPropertySource.
# ===========================================================================

spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

app.storage.root=${STORAGE_ROOT:./data/storage}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

app.trash-retention-days=${TRASH_RETENTION_DAYS:30}
app.rate-limit.login-per-10min=${RATE_LIMIT_LOGIN:10}
app.rate-limit.register-per-hour=${RATE_LIMIT_REGISTER:10}
