<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="csrf-header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title th:text="${title} + ' · Cloud Vault'">Cloud Vault</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header class="topbar" th:fragment="topbar">
    <a class="brand" th:href="@{/app}">Cloud&nbsp;Vault</a>
    <nav class="topnav" aria-label="Main navigation">
        <a th:href="@{/app}"
           th:classappend="${currentUri == '/app'} ? 'active'">Dashboard</a>
        <a th:href="@{/app/files}"
           th:classappend="${currentUri.startsWith('/app/files') or currentUri.startsWith('/app/search')} ? 'active'">Files</a>
        <a th:href="@{/app/trash}"
           th:classappend="${currentUri.startsWith('/app/trash')} ? 'active'">Trash</a>
        <a th:href="@{/app/shares}"
           th:classappend="${currentUri.startsWith('/app/shares')} ? 'active'">Shares</a>
        <a th:href="@{/app/subscription}"
           th:classappend="${currentUri.startsWith('/app/subscription')} ? 'active'">Plan</a>
        <a th:href="@{/app/notifications}"
           th:classappend="${currentUri.startsWith('/app/notifications')} ? 'active'">
            Notifications<span class="badge" th:if="${unread != null and unread > 0}"
                               th:text="${unread}">0</span>
        </a>
        <a th:href="@{/app/settings}"
           th:classappend="${currentUri.startsWith('/app/settings')} ? 'active'">Settings</a>
        <a th:href="@{/admin}" th:if="${isAdmin}"
           th:classappend="${currentUri.startsWith('/admin')} ? 'active'">Admin</a>
    </nav>
    <div class="topbar-right">
        <span class="plan-chip" th:if="${limits != null}"
              th:text="${limits.planCode()} + ' · ' + ${T(com.cloudvault.service.Format).percent(limits.usedBytes(), limits.quotaBytes())}">FREE</span>
        <button type="button" class="btn btn-ghost" id="theme-toggle" aria-label="Toggle color theme">◐</button>
        <form th:action="@{/logout}" method="post" class="inline-form">
            <button type="submit" class="btn btn-ghost">Sign out</button>
        </form>
    </div>
</header>

<div th:fragment="flash">
    <div class="flash flash-error" th:if="${error}" role="alert" th:text="${error}">Error</div>
    <div class="flash flash-ok" th:if="${message}" role="status" th:text="${message}">Message</div>
</div>

<footer th:fragment="scripts">
    <script th:src="@{/js/app.js}"></script>
</footer>

</body>
</html>
