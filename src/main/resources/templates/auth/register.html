<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body>
<div class="auth-wrap">
  <div class="card auth-card">
    <a class="brand" th:href="@{/}">Cloud Vault</a>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <form th:action="@{/register}" method="post">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="64" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="displayName">Display name (optional)</label>
        <input id="displayName" name="displayName" type="text" maxlength="128">
      </div>
      <div class="field">
        <label for="password">Password (min 10 characters)</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%">Create account</button>
    </form>
    <p class="auth-alt">Already registered? <a th:href="@{/login}">Sign in</a></p>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
